[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = False
no_implicit_optional = True
check_untyped_defs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
warn_return_any = False
files = scripts/android_skill_daemon.py, scripts/ui_act.py, scripts/ui_snapshot.py, scripts/ui_run_flow.py, scripts/test-daemon.py, scripts/test-wedge.py, scripts/harvest-to-maestro.py, scripts/diagnose_tree.py

[mypy-uiautomator2.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True


